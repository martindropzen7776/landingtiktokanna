<style>

*,
*::before,
*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, Helvetica, sans-serif;
}

.page{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#000;
}

/* BACKGROUND */

.bg-photo{
  position:absolute;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;
}

.bg-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
}

/* BUTTON POSITION */

.hotzone{
  position:absolute;
  left:0;
  right:0;

  top:73%;
  transform:translateY(-50%);

  z-index:2;

  display:flex;
  justify-content:center;
  align-items:center;

  width:100%;

  padding:0 1.4rem;
}

/* CTA BUTTON */

.cta{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:.75rem;

  width:100%;
  max-width:420px;

  min-height:72px;

  background:linear-gradient(
    180deg,
    #ff4fb0 0%,
    #ff007f 100%
  );

  color:#fff;

  text-decoration:none;
  text-transform:uppercase;
  text-align:center;

  font-size:clamp(1.05rem,4.5vw,1.45rem);
  line-height:1.05;

  font-weight:800;

  letter-spacing:.02em;

  padding:1rem 1.35rem;

  border:2px solid rgba(255,255,255,.95);

  border-radius:999px;

  box-shadow:
    0 0 18px rgba(255,0,127,.75),
    0 0 42px rgba(255,0,127,.45),
    0 18px 44px rgba(0,0,0,.35);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

  animation:
    fadeUp .7s ease .25s both,
    floatButton 2.6s ease-in-out infinite;

  -webkit-tap-highlight-color:transparent;
}

.cta:hover{
  transform:translateY(-2px) scale(1.02);
}

.cta:active{
  transform:scale(.97);
}

.cta svg{
  width:34px;
  height:34px;
  flex-shrink:0;
}

.cta-text{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.cta-text strong{
  display:block;
}

.cta-text span{
  display:block;
  margin-top:.18rem;
  font-size:.68em;
  font-weight:600;
  letter-spacing:.04em;
}

/* DESKTOP */

@media (min-width:641px){

  .hotzone{
    top:57%;
    bottom:auto;
    transform:translateY(-50%);
  }

  .cta{
    max-width:520px;
  }

}

/* ANIMATIONS */

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes floatButton{

  0%{
    transform:scale(1);

    box-shadow:
      0 0 18px rgba(255,0,127,.75),
      0 0 42px rgba(255,0,127,.45),
      0 18px 44px rgba(0,0,0,.35);
  }

  50%{
    transform:scale(1.055);

    box-shadow:
      0 0 24px rgba(255,0,127,.95),
      0 0 58px rgba(255,0,127,.62),
      0 22px 54px rgba(0,0,0,.42);
  }

  100%{
    transform:scale(1);

    box-shadow:
      0 0 18px rgba(255,0,127,.75),
      0 0 42px rgba(255,0,127,.45),
      0 18px 44px rgba(0,0,0,.35);
  }

}

</style>

<div class="page">

  <!-- BUTTON -->
  <div class="hotzone">

    <a

      class="cta"
      target="_blank"
      rel="noopener"
      onclick="ttq.track('CompletePayment');"
    >

      <svg viewBox="0 0 240 240" aria-hidden="true">

        <path
          d="M120 0C53.7 0 0 53.7 0 120s53.7 120 120 120 120-53.7 120-120S186.3 0 120 0z"
          fill="#229ED9"
        />

        <path
          d="M178.3 74.2L155 184.1c-1.8 7.8-6.4 9.7-13 6.1l-36-26.5-17.4 16.7c-1.9 1.9-3.5 3.5-7.2 3.5l2.6-36.6 66.7-60.2c2.9-2.6-.6-4-4.5-1.4l-82.5 52-35.5-11.1c-7.7-2.4-7.8-7.7 1.6-11.4l138.8-53.5c6.4-2.4 12 1.4 9.7 11.5z"
          fill="#fff"
        />

      </svg>

      <span class="cta-text">
        <strong>GET MY FREE PHOTO</strong>
        <span>ON TELEGRAM</span>
      </span>

    </a>

  </div>

</div>
